<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"><meta name="theme-color" content="#fff8ed"><meta name="description" content="和圆滚滚、贼溜溜从空钱盒开始经营小摊。算预算、投入零花钱、向父母借款、备货卖茶，从零认识会计名词，分清营业收入、毛利与现金。"><title>手打柠檬茶 · 圆滚滚和贼溜溜的夏天</title><link rel="stylesheet" href="demo/style.css"><link rel="stylesheet" href="demo/summer-theme.css"><link rel="stylesheet" href="demo/devices.css"><link rel="stylesheet" href="demo/screen.css"><link rel="stylesheet" href="demo/course.css"><link rel="stylesheet" href="demo/assessment.css"></head>
<body class="learning-locked">
<section id="assessment-page" aria-labelledby="assessment-title"><div class="assessment-shell"><header class="assessment-header">会计入门 · 学前测验</header><main class="assessment-body"><h1 id="assessment-title">先做十道题，再开始经营。</h1><p>正在准备测验…</p></main></div></section>
<header class="site-header"><a class="brand" href="./" aria-label="手打柠檬茶首页"><span class="brand-mark">◒<i></i></span><span>手打柠檬茶<small>圆滚滚和贼溜溜的夏天</small></span></a><div class="header-tools"><button id="openbook" class="outline-button"></button><button type="button" id="openmenu" class="icon-button" aria-label="打开小摊菜单">☰</button></div></header>
<main class="app-shell"><div class="game-hud"><h1 id="chapter-title">开张篇 <span>第一杯柠檬茶</span></h1><div id="snapshot" class="snapshot"></div></div><nav id="progress" class="chapter-progress" aria-label="体验关进度"></nav><div class="game-layout"><aside class="dashboard"><div id="guide" class="guide-card"></div></aside><div class="play-area"><section id="day-timeline" class="day-timeline" aria-label="小摊时间线"></section><section id="play" class="play-card" aria-label="当前经营场景"></section></div></div><div id="scene-actions" class="scene-action-dock" aria-label="当前操作" hidden></div></main>
<dialog id="menu" class="game-menu" aria-labelledby="menu-title"><div class="dialog-heading"><h2 id="menu-title">小摊歇一会儿</h2><button type="button" class="icon-button" data-close="menu" aria-label="关闭菜单">✕</button></div><div class="menu-grid"><button id="viewfacts" class="secondary-button">查看账本</button><button type="button" id="openglossary" class="secondary-button">名词与公式</button><button type="button" id="viewbudget" class="secondary-button">开摊预算</button><button type="button" id="viewstock" class="secondary-button">原料与包材</button><button type="button" id="viewhistory" class="secondary-button">小摊记事</button><button type="button" id="audiosettings" class="secondary-button">声音与音量</button><button id="sound" class="icon-button" aria-label="关闭声音" aria-pressed="true"></button><button id="motion" class="icon-button" aria-label="减少动画" aria-pressed="false"></button><button id="endgame" class="text-button"></button><button type="button" class="mini-link" data-restart>重新开张</button></div><section class="calendar-card" hidden><div id="calendar-label"></div><div id="calendar"></div></section><p id="savestatus" class="save-status" role="status"></p></dialog>
<dialog id="reading" class="reading-dialog" aria-labelledby="reading-title"><div class="dialog-heading"><h2 id="reading-title"></h2><button type="button" class="icon-button" data-close="reading" aria-label="收起这一页">✕</button></div><div id="reading-body" class="reading-body"></div><footer id="reading-actions" class="reading-actions"></footer></dialog>
<dialog id="purchase" aria-labelledby="purchase-title"><div class="dialog-heading"><div><p class="eyebrow">对着配方，自己选</p><h2 id="purchase-title">采购单</h2></div><div class="dialog-tools"><button type="button" class="keyboard-dismiss" data-dismiss-keyboard hidden>收起键盘</button><button type="button" class="icon-button" data-close="purchase" aria-label="先收起采购单">✕</button></div></div><div class="purchase-top"><strong id="purchase-cash"></strong><button type="button" class="mini-link" data-purchase-recipe>每杯配方 ↗</button><button type="button" class="mini-link" data-purchase-reset>按建议量补齐</button></div><div id="purchase-payment" class="purchase-payment"></div><div id="purchase-rows" class="purchase-rows"></div><nav id="purchase-pages" class="purchase-pages" aria-label="翻看采购材料"></nav><div class="purchase-totals"><strong id="purchase-total"></strong><p id="purchase-payment-note"></p><p id="purchase-notice" role="status"></p></div><footer class="purchase-footer"><button type="button" id="confirm-purchase" class="primary-button" data-action="buy-stock" data-confirm-purchase>按这张单采购</button></footer></dialog>
<dialog id="book" aria-labelledby="book-title"><div class="dialog-heading"><div><p class="eyebrow">每一笔，都有来处</p><h2 id="book-title">小摊账本</h2></div><div class="dialog-tools"><button type="button" class="keyboard-dismiss" data-dismiss-keyboard hidden>收起键盘</button><button class="icon-button" data-close="book" aria-label="关闭账本">✕</button></div></div><p id="book-caption" class="muted"></p><nav id="book-tabs" class="book-tabs" aria-label="选择财务报表"></nav><div id="book-body"></div><nav id="sheet-pager" class="sheet-pager" aria-label="翻看当前报表"></nav><footer id="book-footer" class="dialog-footer"></footer></dialog>
<dialog id="confirm" class="confirm-dialog" aria-labelledby="confirm-title"><div id="confirm-body"></div></dialog>
<dialog id="soundsettings" aria-labelledby="sound-title"><div class="dialog-heading"><div><p class="eyebrow">让每一步，都有舒服的回应</p><h2 id="sound-title">声音与音量</h2></div><button type="button" class="icon-button" data-close="soundsettings" aria-label="关闭声音设置">✕</button></div><div class="sound-options"><label class="sound-toggle"><input id="audio-enabled" type="checkbox">开启游戏音效</label><label class="volume-label" for="audio-volume">音量 <output id="audio-volume-label">82%</output></label><input class="volume-control" id="audio-volume" type="range" min="0" max="100" step="1" value="82" aria-label="音效音量"><div class="sound-samples"><button type="button" class="secondary-button" data-preview-sound="coins">试听 · 硬币落进玻璃杯</button><button type="button" class="secondary-button" data-preview-sound="coinsJar">对照 · 硬币落进罐里</button><button type="button" class="primary-button" data-preview-sound="complete">试听 · 过关庆祝</button><button type="button" class="secondary-button" data-preview-sound="tap">试听 · 轻巧点按</button></div><p class="muted" id="sound-preview-note">音量偏好会保存在此浏览器。</p></div></dialog>
<dialog id="glossary" aria-labelledby="glossary-title"><div class="dialog-heading"><h2 id="glossary-title">名词与公式</h2><button type="button" class="icon-button" data-close="glossary" aria-label="关闭名词与公式">✕</button></div><div id="glossary-body"></div><footer class="dialog-footer"><button type="button" class="primary-button" data-close="glossary">看懂了，回到当前进度</button></footer></dialog>
<dialog id="challenge" aria-labelledby="challenge-title"><div class="dialog-heading"><h2 id="challenge-title">进阶题</h2><button type="button" class="icon-button" data-close="challenge" aria-label="关闭进阶题">✕</button></div><div id="challenge-body"></div><footer class="dialog-footer"><button type="button" class="secondary-button" data-close="challenge">回到经营复盘</button></footer></dialog>
<dialog id="discovery" class="discovery-dialog" aria-labelledby="discovery-title"><button type="button" class="icon-button discovery-close" data-close="discovery" aria-label="暂时收起新账页">✕</button><div id="discovery-body"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div><div id="confetti" aria-hidden="true"></div>
<script type="module" src="demo/app.js"></script>
</body></html>
